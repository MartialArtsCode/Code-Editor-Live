<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Code Editor v2.0</title>
  <style>
    :root {
      --bg-main: #1e1e2e;
      --bg-sec: #181825;
      --bg-panel: #313244;
      --accent: #cba6f7;
      --accent-hover: #b4befe;
      --text-main: #cdd6f4;
      --text-muted: #a6adc8;
      --border: #45475a;
      --console-bg: #11111b;
      --font-mono: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
    }

    [data-theme="light"] {
      --bg-main: #eff1f5;
      --bg-sec: #e6e9ef;
      --bg-panel: #ccd0da;
      --accent: #8839ef;
      --accent-hover: #7287fd;
      --text-main: #4c4f69;
      --text-muted: #6c6f85;
      --border: #bcc0cc;
      --console-bg: #dce0e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      height: 48px;
      background: var(--bg-sec);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .brand { font-weight: bold; font-family: var(--font-mono); color: var(--accent); }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    
    button, select {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover, select:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: var(--bg-sec); font-weight: 600; }

    /* LAYOUT & PANES */
    .workspace {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 48px);
      position: relative;
    }

    .pane { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .sidebar { width: 220px; min-width: 150px; background: var(--bg-sec); border-right: 1px solid var(--border); }
    .editor-pane { flex: 1; min-width: 300px; background: var(--bg-main); }
    .preview-pane { width: 40%; min-width: 250px; background: var(--bg-sec); border-left: 1px solid var(--border); }

    .gutter {
      width: 5px;
      background: var(--border);
      cursor: col-resize;
      transition: background 0.2s;
    }
    .gutter:hover, .gutter.dragging { background: var(--accent); }

    /* FILE TREE */
    .pane-title {
      padding: 10px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .file-list { list-style: none; padding: 8px 0; }
    .file-item {
      padding: 6px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-family: var(--font-mono);
    }
    .file-item:hover { background: var(--bg-panel); }
    .file-item.active { background: var(--bg-panel); border-left: 3px solid var(--accent); }

    /* TABS */
    .tabs {
      display: flex;
      background: var(--bg-sec);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      padding: 8px 16px;
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      border-right: 1px solid var(--border);
      background: var(--bg-sec);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab.active { background: var(--bg-main); color: var(--text-main); border-top: 2px solid var(--accent); }

    /* EDITOR & CONSOLE */
    .editor-container { flex: 1; position: relative; }
    textarea.code-editor {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      border: none;
      outline: none;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      tab-size: 2;
    }

    .console-pane {
      height: 160px;
      background: var(--console-bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .console-logs {
      flex: 1;
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-y: auto;
    }
    .log-entry { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px; }
    .log-info { color: #89dceb; }
    .log-warn { color: #f9e2af; }
    .log-error { color: #f38ba8; }

    /* IFRAME PREVIEW */
    iframe.preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* COMMAND PALETTE */
    .palette-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding-top: 80px;
      z-index: 1000;
    }
    .palette-modal {
      background: var(--bg-sec);
      border: 1px solid var(--border);
      width: 500px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .palette-input {
      width: 100%;
      padding: 14px;
      background: var(--bg-main);
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      font-size: 16px;
      outline: none;
    }
    .palette-results { list-style: none; max-height: 300px; overflow-y: auto; }
    .palette-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }
    .palette-item:hover, .palette-item.selected { background: var(--accent); color: var(--bg-sec); }
  </style>
</head>
<body>

  <header>
    <div class="brand">&lt;/&gt; Live Code Editor v2.0</div>
    <div class="header-controls">
      <select id="projectMode">
        <option value="monolithic">Monolithic (HTML/CSS/JS)</option>
        <option value="modular">Modular (ES Modules)</option>
      </select>
      <button class="btn-primary" onclick="runCode()">▶ Run (Ctrl+R)</button>
      <button onclick="toggleCommandPalette()">⌘ Commands (Ctrl+K)</button>
      <button onclick="toggleTheme()">🌙 Theme</button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <!-- SIDEBAR -->
    <div class="pane sidebar" id="sidebar">
      <div class="pane-title">Files</div>
      <ul class="file-list" id="fileTree"></ul>
    </div>

    <div class="gutter" id="gutter1"></div>

    <!-- EDITOR & CONSOLE -->
    <div class="pane editor-pane" id="editorPane">
      <div class="tabs" id="tabContainer"></div>
      <div class="editor-container">
        <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
      </div>
      <div class="console-pane">
        <div class="pane-title" style="display:flex; justify-content:space-between;">
          <span>Console Output</span>
          <span style="cursor:pointer;" onclick="clearConsole()">Clear</span>
        </div>
        <div class="console-logs" id="consoleLogs"></div>
      </div>
    </div>

    <div class="gutter" id="gutter2"></div>

    <!-- PREVIEW -->
    <div class="pane preview-pane" id="previewPane">
      <div class="pane-title">Live Preview</div>
      <iframe class="preview-frame" id="previewFrame"></iframe>
    </div>
  </div>

  <!-- COMMAND PALETTE MODAL -->
  <div class="palette-overlay" id="paletteOverlay">
    <div class="palette-modal">
      <input type="text" class="palette-input" id="paletteInput" placeholder="Type a command..." />
      <ul class="palette-results" id="paletteResults"></ul>
    </div>
  </div>

  <script>
    // INITIAL VIRTUAL FILESYSTEM
    let files = {
      'index.html': `<!DOCTYPE html>\n<html>\n<head>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Hello World</h1>\n  <button id="btn">Click Me</button>\n  <script src="script.js"><\/script>\n</body>\n</html>`,
      'style.css': `body {\n  font-family: sans-serif;\n  background: #f4f4f9;\n  padding: 20px;\n}\nh1 {\n  color: #333;\n}`,
      'script.js': `console.log("App ready!");\n\ndocument.getElementById('btn').addEventListener('click', async () => {\n  console.log("Fetching mock API...");\n  const res = await fetch('/api/users');\n  const data = await res.json();\n  console.log("Mock Response:", data);\n});`
    };

    let mockRoutes = [
      { path: '/api/users', method: 'GET', status: 200, response: [{ id: 1, name: 'Carlos Padilla' }, { id: 2, name: 'Alex' }] }
    ];

    let activeFile = 'index.html';

    // UI ELEMENTS
    const fileTree = document.getElementById('fileTree');
    const tabContainer = document.getElementById('tabContainer');
    const codeEditor = document.getElementById('codeEditor');
    const previewFrame = document.getElementById('previewFrame');
    const consoleLogs = document.getElementById('consoleLogs');

    // INITIALIZATION
    function init() {
      renderFiles();
      renderTabs();
      loadActiveFile();
      setupResizing();
      setupMockServiceWorker();
      runCode();
    }

    function renderFiles() {
      fileTree.innerHTML = '';
      Object.keys(files).forEach(filename => {
        const li = document.createElement('li');
        li.className = `file-item ${filename === activeFile ? 'active' : ''}`;
        li.innerText = filename;
        li.onclick = () => switchFile(filename);
        fileTree.appendChild(li);
      });
    }

    function renderTabs() {
      tabContainer.innerHTML = '';
      Object.keys(files).forEach(filename => {
        const div = document.createElement('div');
        div.className = `tab ${filename === activeFile ? 'active' : ''}`;
        div.innerText = filename;
        div.onclick = () => switchFile(filename);
        tabContainer.appendChild(div);
      });
    }

    function loadActiveFile() {
      codeEditor.value = files[activeFile];
    }

    function switchFile(filename) {
      files[activeFile] = codeEditor.value;
      activeFile = filename;
      renderFiles();
      renderTabs();
      loadActiveFile();
    }

    codeEditor.addEventListener('input', () => {
      files[activeFile] = codeEditor.value;
    });

    // MOCK SERVICE WORKER (Blob URL Registration)
    async function setupMockServiceWorker() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          let routes = ${JSON.stringify(mockRoutes)};
          self.addEventListener('fetch', (event) => {
            const url = new URL(event.request.url);
            const route = routes.find(r => r.path === url.pathname && r.method === event.request.method);
            if (route) {
              event.respondWith(new Response(JSON.stringify(route.response), {
                status: route.status,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        try {
          await navigator.serviceWorker.register(swUrl);
        } catch (e) {
          console.warn('SW registration bypassed for local Blob environment.');
        }
      }
    }

    // RUN CODE & INTERCEPT CONSOLE
    function runCode() {
      files[activeFile] = codeEditor.value;
      
      const consoleScript = `
        <script>
          (function() {
            const _log = console.log, _warn = console.warn, _error = console.error;
            function send(type, args) {
              window.parent.postMessage({ type: 'CONSOLE_LOG', logType: type, msg: Array.from(args).join(' ') }, '*');
            }
            console.log = (...args) => { send('info', args); _log.apply(console, args); };
            console.warn = (...args) => { send('warn', args); _warn.apply(console, args); };
            console.error = (...args) => { send('error', args); _error.apply(console, args); };
          })();
        <\/script>
      `;

      let html = files['index.html'] || '';
      html = html.replace('<head>', '<head>' + consoleScript);

      // Inject inline CSS
      if (files['style.css']) {
        html = html.replace('</head>', `<style>${files['style.css']}</style></head>`);
      }

      // Inject inline JS
      if (files['script.js']) {
        html = html.replace('</body>', `<script>${files['script.js']}<\/script></body>`);
      }

      previewFrame.srcdoc = html;
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'CONSOLE_LOG') {
        const entry = document.createElement('div');
        entry.className = `log-entry log-${event.data.logType}`;
        entry.innerText = `> ${event.data.msg}`;
        consoleLogs.appendChild(entry);
        consoleLogs.scrollTop = consoleLogs.scrollHeight;
      }
    });

    function clearConsole() {
      consoleLogs.innerHTML = '';
    }

    // RESIZABLE PANELS
    function setupResizing() {
      const workspace = document.getElementById('workspace');
      const gutter1 = document.getElementById('gutter1');
      const gutter2 = document.getElementById('gutter2');
      const sidebar = document.getElementById('sidebar');
      const previewPane = document.getElementById('previewPane');

      let draggingGutter = null;

      gutter1.addEventListener('mousedown', () => draggingGutter = 1);
      gutter2.addEventListener('mousedown', () => draggingGutter = 2);

      document.addEventListener('mousemove', (e) => {
        if (!draggingGutter) return;
        const rect = workspace.getBoundingClientRect();
        
        if (draggingGutter === 1) {
          const newWidth = e.clientX - rect.left;
          if (newWidth > 120 && newWidth < 400) {
            sidebar.style.width = `${newWidth}px`;
          }
        } else if (draggingGutter === 2) {
          const newWidth = rect.right - e.clientX;
          if (newWidth > 200 && newWidth < rect.width - 400) {
            previewPane.style.width = `${newWidth}px`;
          }
        }
      });

      document.addEventListener('mouseup', () => draggingGutter = null);
    }

    // COMMAND PALETTE
    const paletteOverlay = document.getElementById('paletteOverlay');
    const paletteInput = document.getElementById('paletteInput');
    const paletteResults = document.getElementById('paletteResults');

    const commands = [
      { label: 'Run Code', action: runCode },
      { label: 'Toggle Theme', action: toggleTheme },
      { label: 'Clear Console', action: clearConsole },
      { label: 'Create New File', action: () => {
        const name = prompt('Enter filename (e.g. utils.js):');
        if (name) { files[name] = ''; switchFile(name); }
      }}
    ];

    function toggleCommandPalette() {
      paletteOverlay.style.display = paletteOverlay.style.display === 'flex' ? 'none' : 'flex';
      if (paletteOverlay.style.display === 'flex') {
        paletteInput.value = '';
        paletteInput.focus();
        renderPaletteResults(commands);
      }
    }

    function renderPaletteResults(items) {
      paletteResults.innerHTML = '';
      items.forEach(cmd => {
        const li = document.createElement('li');
        li.className = 'palette-item';
        li.innerText = cmd.label;
        li.onclick = () => { cmd.action(); toggleCommandPalette(); };
        paletteResults.appendChild(li);
      });
    }

    paletteInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = commands.filter(c => c.label.toLowerCase().includes(term));
      renderPaletteResults(filtered);
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        toggleCommandPalette();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
        e.preventDefault();
        runCode();
      }
      if (e.key === 'Escape' && paletteOverlay.style.display === 'flex') {
        toggleCommandPalette();
      }
    });

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') !== 'light';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    }

    window.onload = init;
  </script>
</body>
</html>
